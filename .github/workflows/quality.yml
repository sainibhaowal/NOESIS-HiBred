name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compile, test, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch
          python -m pip install transformers tokenizers datasets safetensors numpy sympy Pillow tqdm pytest pytest-cov coverage

      - name: Run NOESIS quality gate
        run: python scripts/quality_gate.py
