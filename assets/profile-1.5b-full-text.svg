<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">NOESIS Sigma full-text 1.5B-class profile</title>
  <desc id="desc">Text-only configuration with compressed KV retrieval, Engram memory, a trained MTP draft head, and vision disabled.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10172d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20d6c7"/><stop offset="1" stop-color="#8d72ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#f5f8ff}.subtitle{font:400 18px Inter,Arial,sans-serif;fill:#a9b9ce}.section{font:700 18px Inter,Arial,sans-serif;fill:#dbe8fb;letter-spacing:1px}.label{font:700 20px Inter,Arial,sans-serif;fill:#f7fbff}.body{font:400 16px Inter,Arial,sans-serif;fill:#bfd0e4}.small{font:400 14px Inter,Arial,sans-serif;fill:#98abc2}.card{fill:#111f33;stroke:#29455f;stroke-width:2}.active{fill:#102c39;stroke:#20d6c7;stroke-width:2}.off{fill:#251d42;stroke:#9b83ff;stroke-width:2}.number{font:700 36px Inter,Arial,sans-serif;fill:#20d6c7}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect x="58" y="54" width="10" height="78" rx="5" fill="url(#accent)"/>
  <text x="94" y="88" class="title">NOESIS-Σ Full-Text 1.5B-Class Profile</text>
  <text x="94" y="118" class="subtitle">`core/config_1.5b_full_text_256k.json` activates text features while retaining vision_n_layers = 0.</text>

  <rect x="58" y="178" width="470" height="286" rx="20" class="card" filter="url(#shadow)"/>
  <text x="90" y="220" class="section">SCALE AND PRECISION</text>
  <text x="90" y="282" class="number">1.5B-class</text><text x="90" y="310" class="body">parameter budget balanced before runtime verification</text>
  <text x="90" y="366" class="label">18 backbone blocks</text><text x="90" y="394" class="body">D = 1536, 12 heads, HC streams = 2</text>
  <text x="90" y="430" class="small">BF16 model state and 8-bit AdamW on CUDA.</text>

  <rect x="568" y="178" width="974" height="286" rx="20" class="card" filter="url(#shadow)"/>
  <text x="600" y="220" class="section">TEXT EXECUTION PATH</text>
  <rect x="600" y="262" width="188" height="132" rx="14" class="active"/><text x="624" y="302" class="label">Input</text><text x="624" y="330" class="body">32,000-token BPE</text><text x="624" y="354" class="body">256k configured limit</text>
  <rect x="816" y="262" width="208" height="132" rx="14" class="active"/><text x="840" y="302" class="label">Engram</text><text x="840" y="330" class="body">blocks 3, 9, and 15</text><text x="840" y="354" class="body">3-gram hash memory</text>
  <rect x="1052" y="262" width="224" height="132" rx="14" class="active"/><text x="1076" y="302" class="label">Compressed KV</text><text x="1076" y="330" class="body">source block 2</text><text x="1076" y="354" class="body">8-to-1 sparse retrieval</text>
  <rect x="1304" y="262" width="206" height="132" rx="14" class="active"/><text x="1328" y="302" class="label">MTP / DSpark</text><text x="1328" y="330" class="body">2-token draft block</text><text x="1328" y="354" class="body">targets blocks 9 and 15</text>

  <rect x="58" y="512" width="1012" height="342" rx="20" class="card" filter="url(#shadow)"/>
  <text x="90" y="554" class="section">TRAINED TEXT FEATURES</text>
  <rect x="90" y="590" width="282" height="96" rx="14" class="active"/><text x="114" y="628" class="label">Sparse MLA</text><text x="114" y="656" class="body">256-token local window</text>
  <rect x="400" y="590" width="282" height="96" rx="14" class="active"/><text x="424" y="628" class="label">MoE</text><text x="424" y="656" class="body">8 routed, top-k 2, 1 shared</text>
  <rect x="710" y="590" width="322" height="96" rx="14" class="active"/><text x="734" y="628" class="label">OSC</text><text x="734" y="656" class="body">rank 128, four relaxation steps</text>
  <rect x="90" y="722" width="442" height="96" rx="14" class="active"/><text x="114" y="760" class="label">Teacher-forced MTP loss</text><text x="114" y="788" class="body">draft cross-entropy plus confidence calibration</text>
  <rect x="560" y="722" width="472" height="96" rx="14" class="active"/><text x="584" y="760" class="label">Long-context settings</text><text x="584" y="788" class="body">YaRN parameters and compressed retrieval are configured</text>

  <rect x="1118" y="512" width="424" height="342" rx="20" class="card" filter="url(#shadow)"/>
  <text x="1150" y="554" class="section">INTENTIONALLY DISABLED</text>
  <rect x="1150" y="590" width="360" height="112" rx="14" class="off"/><text x="1174" y="632" class="label">Vision tower</text><text x="1174" y="662" class="body">vision_n_layers = 0</text><text x="1174" y="686" class="small">No image patches are accepted by this profile.</text>
  <text x="1150" y="760" class="small">The exact parameter total, memory use,</text><text x="1150" y="784" class="small">and 256k behavior require a GPU preflight.</text>

  <rect x="58" y="884" width="1484" height="38" rx="12" fill="#0d1a2c" stroke="#29455f" stroke-width="2"/>
  <text x="88" y="909" class="small">This profile activates implemented text paths. A successful short pilot validates execution, not language quality or long-context capability.</text>
</svg>
