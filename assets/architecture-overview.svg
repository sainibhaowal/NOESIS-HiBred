<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">NOESIS Sigma general model architecture</title>
  <desc id="desc">Configuration-driven data flow from tokens and optional images, through the NOESIS Sigma backbone, to training and inference outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10172d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20d6c7"/><stop offset="1" stop-color="#8d72ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7f9ab5"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#f5f8ff}.subtitle{font:400 18px Inter,Arial,sans-serif;fill:#a9b9ce}.section{font:700 18px Inter,Arial,sans-serif;fill:#dbe8fb;letter-spacing:1px}.label{font:700 20px Inter,Arial,sans-serif;fill:#f7fbff}.body{font:400 16px Inter,Arial,sans-serif;fill:#bfd0e4}.small{font:400 14px Inter,Arial,sans-serif;fill:#98abc2}.tag{font:700 13px Inter,Arial,sans-serif;fill:#04201e}.card{fill:#111f33;stroke:#29455f;stroke-width:2}.active{fill:#102c39;stroke:#20d6c7;stroke-width:2}.optional{fill:#251d42;stroke:#9b83ff;stroke-width:2}.line{stroke:#7f9ab5;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="58" y="54" width="10" height="78" rx="5" fill="url(#accent)"/>
  <text x="94" y="88" class="title">NOESIS-Σ General Architecture</text>
  <text x="94" y="118" class="subtitle">A configuration-driven causal foundation-model architecture. Teal modules are core; violet modules are enabled only by configuration.</text>

  <rect x="58" y="170" width="240" height="610" rx="20" class="card" filter="url(#shadow)"/>
  <text x="88" y="210" class="section">INPUTS</text>
  <rect x="82" y="242" width="192" height="112" rx="14" class="active"/>
  <text x="104" y="282" class="label">Token IDs</text><text x="104" y="310" class="body">Text or structured</text><text x="104" y="334" class="body">token sequence [B, S]</text>
  <rect x="82" y="400" width="192" height="112" rx="14" class="optional"/>
  <text x="104" y="440" class="label">Image inputs</text><text x="104" y="468" class="body">Patches and image</text><text x="104" y="492" class="body">span metadata</text>
  <rect x="82" y="558" width="192" height="146" rx="14" class="card"/>
  <text x="104" y="598" class="label">Input adapters</text><text x="104" y="626" class="body">Tokenizer</text><text x="104" y="650" class="body">ParallelEmbedding</text><text x="104" y="674" class="body">Optional ViT + Aligner</text>

  <rect x="350" y="170" width="830" height="610" rx="20" class="card" filter="url(#shadow)"/>
  <text x="382" y="210" class="section">CAUSAL BACKBONE</text>
  <rect x="382" y="242" width="766" height="78" rx="14" class="active"/>
  <text x="410" y="274" class="label">Residual stream expansion</text><text x="410" y="300" class="body">Embedding [B, S, D] → H [B, S, M, D], where M = hc_mult</text>
  <rect x="382" y="364" width="358" height="216" rx="16" class="active"/>
  <text x="410" y="404" class="label">Lower block stack</text><text x="410" y="432" class="body">Blocks 0 through floor(L / 2) - 1</text>
  <text x="410" y="468" class="body">Sinkhorn Hyper-Connections</text><text x="410" y="494" class="body">Sparse latent attention</text><text x="410" y="520" class="body">Routed and shared MoE</text><text x="410" y="552" class="small">Optional Engram lookup is applied when configured.</text>
  <rect x="790" y="364" width="358" height="216" rx="16" class="active"/>
  <text x="818" y="404" class="label">Upper block stack</text><text x="818" y="432" class="body">Blocks floor(L / 2) through L - 1</text>
  <text x="818" y="468" class="body">Sinkhorn Hyper-Connections</text><text x="818" y="494" class="body">Sparse latent attention</text><text x="818" y="520" class="body">Routed and shared MoE</text><text x="818" y="552" class="small">Backbone dimensions are configuration fields.</text>
  <rect x="597" y="614" width="336" height="126" rx="16" class="active"/>
  <text x="625" y="652" class="label">Mid-network OSC block</text><text x="625" y="680" class="body">Collapse H → continuous relaxation</text><text x="625" y="706" class="body">Inject residual delta back into H</text>
  <path d="M274 630 L330 630 L330 281 L376 281" class="line"/><path d="M620 320 L560 358" class="line"/><path d="M560 580 L560 677 L591 677" class="line"/><path d="M939 677 L969 677 L969 586" class="line"/>

  <rect x="1232" y="170" width="310" height="610" rx="20" class="card" filter="url(#shadow)"/>
  <text x="1262" y="210" class="section">OUTPUTS</text>
  <rect x="1258" y="242" width="258" height="114" rx="14" class="active"/>
  <text x="1282" y="282" class="label">Output head</text><text x="1282" y="310" class="body">HC collapse</text><text x="1282" y="334" class="body">RMSNorm → vocabulary logits</text>
  <rect x="1258" y="402" width="258" height="112" rx="14" class="active"/>
  <text x="1282" y="442" class="label">Training path</text><text x="1282" y="470" class="body">Next-token logits</text><text x="1282" y="494" class="body">SigmaVerifierLoss</text>
  <rect x="1258" y="560" width="258" height="112" rx="14" class="optional"/>
  <text x="1282" y="600" class="label">Inference path</text><text x="1282" y="628" class="body">Autoregressive sampling</text><text x="1282" y="652" class="body">Optional MTP / DSpark</text>
  <path d="M1154 472 L1200 472 L1200 299 L1252 299" class="line"/><path d="M1387 356 L1387 396" class="line"/><path d="M1387 514 L1387 554" class="line"/>

  <rect x="58" y="830" width="1484" height="94" rx="18" fill="#0d1a2c" stroke="#29455f" stroke-width="2"/>
  <rect x="88" y="860" width="18" height="18" rx="4" fill="#20d6c7"/><text x="118" y="875" class="body">Core model path</text>
  <rect x="350" y="860" width="18" height="18" rx="4" fill="#9b83ff"/><text x="380" y="875" class="body">Optional configuration-controlled module</text>
  <text x="790" y="875" class="body">Configuration controls vision, Engram, sparse long-range KV, MTP, model scale, and runtime limits.</text>
</svg>
