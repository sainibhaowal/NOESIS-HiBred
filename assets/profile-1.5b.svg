<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">NOESIS Sigma 1.5B configuration profile</title>
  <desc id="desc">Implemented 1.5B configuration showing active model components, disabled optional components, and runtime limits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10172d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20d6c7"/><stop offset="1" stop-color="#8d72ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#f5f8ff}.subtitle{font:400 18px Inter,Arial,sans-serif;fill:#a9b9ce}.section{font:700 18px Inter,Arial,sans-serif;fill:#dbe8fb;letter-spacing:1px}.label{font:700 20px Inter,Arial,sans-serif;fill:#f7fbff}.body{font:400 16px Inter,Arial,sans-serif;fill:#bfd0e4}.small{font:400 14px Inter,Arial,sans-serif;fill:#98abc2}.card{fill:#111f33;stroke:#29455f;stroke-width:2}.active{fill:#102c39;stroke:#20d6c7;stroke-width:2}.off{fill:#251d42;stroke:#9b83ff;stroke-width:2}.number{font:700 36px Inter,Arial,sans-serif;fill:#20d6c7}.number2{font:700 36px Inter,Arial,sans-serif;fill:#9b83ff}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect x="58" y="54" width="10" height="78" rx="5" fill="url(#accent)"/>
  <text x="94" y="88" class="title">NOESIS-Σ 1.5B Configuration Profile</text>
  <text x="94" y="118" class="subtitle">`core/config_1.5b_256k.json` describes the current text-first training configuration. This profile is not a performance claim.</text>

  <rect x="58" y="178" width="454" height="286" rx="20" class="card" filter="url(#shadow)"/>
  <text x="90" y="220" class="section">MODEL SCALE</text>
  <text x="90" y="282" class="number">1.523B</text><text x="90" y="310" class="body">total parameters reported by the trainer</text>
  <text x="90" y="372" class="number2">Preflight</text><text x="90" y="400" class="body">reports active parameters per MoE top-k</text>
  <text x="90" y="438" class="small">Recalculate after configuration changes.</text>

  <rect x="558" y="178" width="984" height="286" rx="20" class="card" filter="url(#shadow)"/>
  <text x="590" y="220" class="section">ACTIVE BACKBONE LAYOUT</text>
  <rect x="590" y="262" width="218" height="132" rx="14" class="active"/><text x="614" y="302" class="label">Input</text><text x="614" y="330" class="body">32,000-token BPE</text><text x="614" y="354" class="body">D = 1536</text><text x="614" y="378" class="body">HC streams = 2</text>
  <rect x="844" y="262" width="218" height="132" rx="14" class="active"/><text x="868" y="302" class="label">Lower stack</text><text x="868" y="330" class="body">9 blocks: 0 through 8</text><text x="868" y="354" class="body">12 attention heads</text><text x="868" y="378" class="body">window = 256</text>
  <rect x="1098" y="262" width="190" height="132" rx="14" class="active"/><text x="1122" y="302" class="label">OSC</text><text x="1122" y="330" class="body">after block 8</text><text x="1122" y="354" class="body">rank = 128</text><text x="1122" y="378" class="body">4 steps</text>
  <rect x="1324" y="262" width="186" height="132" rx="14" class="active"/><text x="1348" y="302" class="label">Upper stack</text><text x="1348" y="330" class="body">9 blocks: 9 through 17</text><text x="1348" y="354" class="body">8 routed experts</text><text x="1348" y="378" class="body">top-k = 2 + shared</text>

  <rect x="58" y="512" width="718" height="342" rx="20" class="card" filter="url(#shadow)"/>
  <text x="90" y="554" class="section">ACTIVE IN THIS PROFILE</text>
  <rect x="90" y="590" width="298" height="96" rx="14" class="active"/><text x="114" y="628" class="label">Sparse MLA</text><text x="114" y="656" class="body">Local sliding-window KV path</text>
  <rect x="420" y="590" width="318" height="96" rx="14" class="active"/><text x="444" y="628" class="label">MoE</text><text x="444" y="656" class="body">8 routed, 1 shared, top-k 2</text>
  <rect x="90" y="722" width="298" height="96" rx="14" class="active"/><text x="114" y="760" class="label">OSC</text><text x="114" y="788" class="body">Enabled with retrograde control</text>
  <rect x="420" y="722" width="318" height="96" rx="14" class="active"/><text x="444" y="760" class="label">Runtime dtype</text><text x="444" y="788" class="body">BF16 model; 8-bit AdamW on CUDA</text>

  <rect x="824" y="512" width="718" height="342" rx="20" class="card" filter="url(#shadow)"/>
  <text x="856" y="554" class="section">DISABLED OR NOT VALIDATED</text>
  <rect x="856" y="590" width="298" height="96" rx="14" class="off"/><text x="880" y="628" class="label">Vision</text><text x="880" y="656" class="body">vision_n_layers = 0</text>
  <rect x="1186" y="590" width="318" height="96" rx="14" class="off"/><text x="1210" y="628" class="label">Engram</text><text x="1210" y="656" class="body">engram_layer_ids = []</text>
  <rect x="856" y="722" width="298" height="96" rx="14" class="off"/><text x="880" y="760" class="label">Long-range KV</text><text x="880" y="788" class="body">compression sources disabled</text>
  <rect x="1186" y="722" width="318" height="96" rx="14" class="off"/><text x="1210" y="760" class="label">MTP / DSpark</text><text x="1210" y="788" class="body">draft block size = 0</text>

  <rect x="58" y="884" width="1484" height="38" rx="12" fill="#0d1a2c" stroke="#29455f" stroke-width="2"/>
  <text x="88" y="909" class="small">Configured max sequence length: 256,000 tokens. The actual run length is set by --seq_len. A 256k end-to-end training validation is still required before making a long-context capability claim.</text>
</svg>
